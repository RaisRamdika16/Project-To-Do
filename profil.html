<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/dist/output.css" rel="stylesheet" />
    <title>Profile</title>
  </head>
  <body class="min-h-screen bg-white font-sans text-black">
    <div class="flex min-h-screen">
      <aside
        class="w-48 shrink-0 border-r border-gray-300 bg-[#f7f5f5] px-6 py-5"
      >
        <a
          href="home.html"
          class="mb-7 inline-flex items-center gap-1 text-xs font-medium text-blue-600 hover:text-blue-800"
        >
          <span aria-hidden="true">&larr;</span>
          Back to Home
        </a>

        <div class="mb-6 flex justify-center">
          <div
            class="flex h-24 w-24 items-center justify-center rounded-full border-4 border-white bg-gray-200 shadow-sm"
            aria-label="Profile picture frame"
          >
            <svg
              class="h-14 w-14 text-slate-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="8" r="3" stroke-width="1.8" />
              <path
                stroke-linecap="round"
                stroke-width="1.8"
                d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"
              />
            </svg>
          </div>
        </div>

        <nav class="space-y-3 text-sm font-bold">
          <a href="profil.html" class="block hover:text-blue-600">Profile</a>
          <a href="bookmark.html" class="block hover:text-blue-600">Bookmark</a>
          <a href="add-task.html" class="block hover:text-blue-600"
            >Add New Task</a
          >
          <a href="completed.html" class="block hover:text-blue-600"
            >Completed Task</a
          >
        </nav>
      </aside>

      <main class="flex-1 px-6 py-6 sm:px-8">
        <section class="max-w-4xl">
          <h1 class="mb-5 text-xl font-bold">Edit Information</h1>

          <form
            id="profileForm"
            class="rounded-xl border border-gray-400 bg-white px-7 py-6 shadow-[0_1px_4px_rgba(0,0,0,0.25)]"
          >
            <div class="space-y-4">
              <label class="block">
                <span class="mb-1 block text-xs font-bold">First Name</span>
                <input
                  id="firstName"
                  class="profile-input"
                  type="text"
                  value="Riri"
                  placeholder="First Name"
                />
              </label>

              <label class="block">
                <span class="mb-1 block text-xs font-bold">Last Name</span>
                <input
                  id="lastName"
                  class="profile-input"
                  type="text"
                  value="Ramdika"
                  placeholder="Last Name"
                />
              </label>

              <div>
                <span class="mb-1 block text-xs font-bold">Date Of Birth</span>
                <div class="relative max-w-sm">
                  <input
                    id="birthDate"
                    class="profile-input pr-8"
                    type="date"
                    value="1980-01-01"
                    aria-label="Date of birth"
                  />
                  <svg
                    class="pointer-events-none absolute bottom-1.5 right-1 h-4 w-4 text-gray-500"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <rect
                      x="3"
                      y="4"
                      width="18"
                      height="17"
                      rx="2"
                      stroke-width="1.8"
                    />
                    <path stroke-width="1.8" d="M16 2v4M8 2v4M3 10h18" />
                  </svg>
                </div>
              </div>

              <label class="block max-w-32">
                <span class="mb-1 block text-xs font-bold">Gender</span>
                <select id="gender" class="profile-input" aria-label="Gender">
                  <option value="" disabled>Select gender</option>
                  <option value="Male">Male</option>
                  <option value="Female" selected>Female</option>
                </select>
              </label>

              <label class="block">
                <span class="mb-1 block text-xs font-bold">Email</span>
                <input
                  id="email"
                  class="profile-input"
                  type="email"
                  value="ebwfiwbf@gmail.com"
                  placeholder="Email"
                />
              </label>
            </div>

            <div
              id="formActions"
              class="mt-5 flex justify-between sm:justify-end sm:gap-40"
            >
              <button
                id="cancelButton"
                type="button"
                class="rounded-md border border-gray-500 bg-white px-5 py-2 text-xs font-bold hover:bg-gray-100"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="rounded-md bg-blue-600 px-7 py-2 text-xs font-bold text-white hover:bg-blue-700"
              >
                Save
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <style>
      .profile-input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #999;
        padding: 0.25rem 0;
        font-size: 0.75rem;
        color: #555;
        outline: none;
        background: transparent;
      }

      .profile-input:focus {
        border-bottom-color: #2563eb;
      }

      .profile-input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0;
        cursor: pointer;
      }
    </style>

    <script src="./dist/script/index.js"></script>
  </body>
</html>
