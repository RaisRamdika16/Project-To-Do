<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./dist/output.css" rel="stylesheet" />
    <title>Todo List - Home</title>
  </head>
  <body
    class="bg-gray-50 h-screen w-screen overflow-hidden font-sans antialiased flex flex-col"
  >
    <!-- NAVBAR -->
    <header class="w-full bg-white shadow-sm shrink-0 h-20 z-50">
      <div
        class="max-w-7xl mx-auto px-8 h-full flex items-center justify-between"
      >
        <!-- Logo -->
        <a href="index.html" class="text-2xl font-extrabold text-blue-600"
          >Todo List</a
        >

        <!-- Navigation Links (Home Aktif) -->
        <nav class="flex items-center space-x-10 font-semibold text-gray-800">
          <a
            href="home.html"
            class="text-blue-600 border-b-2 border-blue-600 pb-1"
            >Home</a
          >
          <a href="completed.html" class="hover:text-blue-600 transition-colors"
            >Completed</a
          >
        </nav>

        <!-- Action Icons -->
        <div class="flex items-center space-x-5 text-gray-700">
          <a
            href="bookmark.html"
            class="hover:text-blue-600"
            aria-label="Saved tasks"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"
              ></path>
            </svg>
          </a>
          <a
            href="profil.html"
            class="hover:text-blue-600"
            aria-label="Profile"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-8 py-10 flex flex-col">
      <!-- HEADER TEKS -->
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900">My Todo List</h1>
        <p class="text-gray-400 text-sm mt-1">
          Stay Organized and get things done!
        </p>
      </div>

      <!-- SEARCH BAR & BUTTON TAMBAH -->
      <div class="flex items-center space-x-4 mb-12">
        <!-- Input Search dengan Ikon Kaca Pembesar -->
        <div class="relative flex-1">
          <input
            type="text"
            placeholder="Search"
            class="w-full bg-white border border-gray-300 rounded-lg py-3 pl-4 pr-10 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
          />
          <div
            class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </div>
        </div>

        <!-- Tombol Plus (+) yang sudah diganti jadi Link -->
        <a
          href="add-task.html"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg shadow-md transition-all flex items-center justify-center shrink-0"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M12 6v6m0 0v6m0-6h6m-6 0H6"
            ></path>
          </svg>
        </a>
      </div>

      <!-- TASK LIST -->
      <div id="taskListContainer" class="space-y-3 max-w-4xl overflow-y-auto">
        <p
          id="emptyState"
          class="text-gray-400 font-medium text-lg tracking-wide"
        >
          Your productivity starts here.
        </p>
      </div>
    </main>

    <script>
      let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
      const container = document.getElementById("taskListContainer");
      const emptyState = document.getElementById("emptyState");

      function renderTasks() {
        container.innerHTML = "";

        const activeTasks = tasks.filter((task) => !task.completed);

        if (activeTasks.length === 0) {
          container.appendChild(emptyState);
          return;
        }

        tasks.forEach((task, index) => {
          if (task.completed) return;

          const taskItem = document.createElement("div");
          taskItem.className =
            "flex items-center justify-between border border-gray-300 rounded-lg px-4 py-3 bg-white shadow-xs";

          const taskInfo = document.createElement("div");
          taskInfo.className = "flex items-center space-x-3";

          const taskName = document.createElement("button");
          taskName.type = "button";
          taskName.className =
            "text-left text-sm text-gray-800 font-medium hover:text-blue-600 transition-colors cursor-pointer";

          // Fallback jika property bernama name atau title
          taskName.textContent = task.name || task.title || "Untitled Task";

          taskName.addEventListener("click", () => {
            // Mencari index asli task dalam array utama
            const originalIndex = tasks.findIndex((t) => t === task);
            const targetIndex = originalIndex !== -1 ? originalIndex : index;

            localStorage.setItem("selectedTaskIndex", String(targetIndex));
            localStorage.setItem("selectedTask", JSON.stringify(task));
            window.location.href = "detail_task.html?id=" + targetIndex;
          });

          const rightSide = document.createElement("div");
          rightSide.className = "flex items-center gap-3";

          const taskDate = document.createElement("span");
          taskDate.className = "text-xs text-gray-400";
          taskDate.textContent = task.date || task.dueDate || "";

          const completeButton = document.createElement("button");
          completeButton.type = "button";
          completeButton.className =
            "text-gray-400 hover:text-green-500 transition-colors p-1";
          completeButton.setAttribute("aria-label", "Mark task complete");
          completeButton.innerHTML = `
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          `;

          completeButton.addEventListener("click", () => {
            tasks[index].completed = true;
            localStorage.setItem("tasks", JSON.stringify(tasks));
            renderTasks();
          });

          const bookmarkButton = document.createElement("button");
          bookmarkButton.type = "button";
          bookmarkButton.className = `transition-colors p-1 ${
            task.bookmarked
              ? "text-blue-600"
              : "text-gray-400 hover:text-blue-500"
          }`;
          bookmarkButton.setAttribute("aria-label", "Bookmark task");
          bookmarkButton.innerHTML = `
            <svg class="w-5 h-5" fill="${task.bookmarked ? "currentColor" : "none"}" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
          `;

          bookmarkButton.addEventListener("click", () => {
            tasks[index].bookmarked = !tasks[index].bookmarked;
            localStorage.setItem("tasks", JSON.stringify(tasks));
            renderTasks();
          });

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className =
            "text-gray-400 hover:text-red-500 transition-colors p-1";
          deleteButton.setAttribute("aria-label", "Delete task");
          deleteButton.innerHTML = `
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M3 7h18m-5 0V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3"/>
            </svg>
          `;

          deleteButton.addEventListener("click", () => {
            tasks.splice(index, 1);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            renderTasks();
          });

          taskInfo.append(taskName);
          rightSide.append(
            taskDate,
            bookmarkButton,
            completeButton,
            deleteButton,
          );
          taskItem.append(taskInfo, rightSide);
          container.appendChild(taskItem);
        });
      }


      renderTasks();
    </script>
  </body>
</html>
