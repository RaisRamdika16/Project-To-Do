<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/output.css" rel="stylesheet" />
    <title>Todo List - Edit Task</title>
  </head>
  <body
    class="bg-[#f2f2f2] h-screen w-screen overflow-hidden font-sans antialiased flex flex-col"
  >
    <header class="w-full bg-white border-b border-gray-200 h-20 shrink-0">
      <div
        class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between"
      >
        <a href="home.html" class="text-2xl font-extrabold text-blue-600"
          >Todo List</a
        >

        <nav
          class="flex items-center gap-8 font-semibold text-gray-700 text-base"
        >
          <a
            href="home.html"
            class="text-blue-600 border-b-2 border-blue-600 pb-1"
            >Home</a
          >
          <a href="completed.html" class="hover:text-blue-600 transition-colors"
            >Completed</a
          >
        </nav>

        <div class="flex items-center gap-4 text-gray-700">
          <a
            href="bookmark.html"
            class="hover:text-blue-600 transition-colors"
            aria-label="Saved tasks"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"
              ></path>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-6 py-8 overflow-y-auto">
      <div class="mb-6">
        <a
          href="home.html"
          class="inline-flex items-center text-gray-700 hover:text-blue-600 font-medium text-sm transition-colors"
        >
          <svg
            class="w-4 h-4 mr-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          Back to list
        </a>
      </div>

      <div class="mb-6">
        <h1 class="text-4xl font-extrabold text-gray-900">Edit Task</h1>
      </div>

      <form
        id="editTaskForm"
        class="space-y-6 rounded-xl border border-gray-200 bg-white p-6 shadow-sm"
      >
        <div>
          <label
            for="taskName"
            class="block text-sm font-bold text-gray-800 mb-2"
            >Task Name</label
          >
          <input
            id="taskName"
            type="text"
            required
            class="w-full bg-white border border-gray-300 rounded-lg p-3.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
          />
        </div>

        <div>
          <label
            for="taskDescription"
            class="block text-sm font-bold text-gray-800 mb-2"
            >Description</label
          >
          <textarea
            id="taskDescription"
            rows="4"
            class="w-full bg-white border border-gray-300 rounded-lg p-3.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm resize-none"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label
              for="taskPriority"
              class="block text-sm font-bold text-gray-800 mb-2"
              >Priority</label
            >
            <select
              id="taskPriority"
              class="w-full bg-white border border-gray-300 rounded-lg p-3.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
            >
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div>
            <label
              for="taskDate"
              class="block text-sm font-bold text-gray-800 mb-2"
              >Due Date</label
            >
            <input
              id="taskDate"
              type="date"
              class="w-full bg-white border border-gray-300 rounded-lg p-3.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label
              for="taskStatus"
              class="block text-sm font-bold text-gray-800 mb-2"
              >Status</label
            >
            <select
              id="taskStatus"
              class="w-full bg-white border border-gray-300 rounded-lg p-3.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
            >
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div>
            <label
              for="taskCreatedAt"
              class="block text-sm font-bold text-gray-800 mb-2"
              >Created At</label
            >
            <input
              id="taskCreatedAt"
              type="date"
              class="w-full bg-white border border-gray-300 rounded-lg p-3.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
            />
          </div>
        </div>

        <div class="flex items-center justify-end gap-4 pt-2">
          <a
            href="home.html"
            class="px-6 py-3 border border-gray-300 rounded-lg font-semibold text-gray-600 hover:bg-gray-100 transition-all"
            >Cancel</a
          >
          <button
            type="submit"
            class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md shadow-blue-500/30 transition-all transform hover:-translate-y-0.5"
          >
            Save Changes
          </button>
        </div>
      </form>
    </main>

    <script src="/script/edit-task.js"></script>
  </body>
</html>
