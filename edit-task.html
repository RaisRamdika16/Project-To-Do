<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./dist/output.css" rel="stylesheet" />
    <title>Todo List - Task Detail</title>
  </head>
  <body
    class="bg-[#f2f2f2] h-screen w-screen overflow-hidden font-sans antialiased flex flex-col"
  >
    <header class="w-full bg-white border-b border-gray-200 h-20 shrink-0">
      <div
        class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between"
      >
        <a href="home.html" class="text-2xl font-extrabold text-blue-600"
          >Todo List</a
        >

        <nav
          class="flex items-center gap-8 font-semibold text-gray-700 text-base"
        >
          <a
            href="home.html"
            class="text-blue-600 border-b-2 border-blue-600 pb-1"
            >Home</a
          >
          <a href="completed.html" class="hover:text-blue-600 transition-colors"
            >Completed</a
          >
        </nav>

        <div class="flex items-center gap-4 text-gray-700">
          <a
            href="bookmark.html"
            class="hover:text-blue-600 transition-colors"
            aria-label="Saved tasks"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"
              ></path>
            </svg>
          </a>
          <button
            class="hover:text-blue-600 transition-colors"
            aria-label="Profile"
          >
            <svg
              class="w-7 h-7"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-8 overflow-y-auto">
      <div class="mb-6 flex items-center justify-between">
        <a
          href="home.html"
          class="inline-flex items-center text-gray-700 hover:text-blue-600 font-medium text-sm transition-colors"
        >
          <svg
            class="w-4 h-4 mr-2"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 19l-7-7m0 0l7-7m-7 7h18"
            ></path>
          </svg>
          Back to list
        </a>

        <div class="flex items-center gap-3">
          <button
            type="button"
            class="bg-white border border-gray-300 rounded-md px-5 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
          >
            Edit
          </button>
          <button
            id="deleteButton"
            type="button"
            class="bg-red-500 border border-red-500 rounded-md px-5 py-2 text-sm font-medium text-white hover:bg-red-600 transition-colors"
          >
            Delete
          </button>
        </div>
      </div>

      <div class="mb-5">
        <h1 id="taskTitle" class="text-4xl font-extrabold text-gray-900">
          Task detail
        </h1>
      </div>

      <div class="space-y-3">
        <div
          class="grid grid-cols-[180px_1fr] border border-gray-300 rounded-lg bg-white overflow-hidden"
        >
          <div
            class="px-4 py-3 font-bold text-gray-800 bg-white border-r border-gray-300"
          >
            Description
          </div>
          <div id="taskDescription" class="px-4 py-3 text-gray-700 bg-white">
            -
          </div>
        </div>

        <div
          class="grid grid-cols-[180px_1fr] border border-gray-300 rounded-lg bg-white overflow-hidden"
        >
          <div
            class="px-4 py-3 font-bold text-gray-800 bg-white border-r border-gray-300"
          >
            Due Date
          </div>
          <div id="taskDate" class="px-4 py-3 text-gray-700 bg-white">-</div>
        </div>

        <div
          class="grid grid-cols-[180px_1fr] border border-gray-300 rounded-lg bg-white overflow-hidden"
        >
          <div
            class="px-4 py-3 font-bold text-gray-800 bg-white border-r border-gray-300"
          >
            Priority
          </div>
          <div id="taskPriority" class="px-4 py-3 bg-white">
            <span
              class="inline-flex items-center px-3 py-1 rounded-sm text-sm font-semibold bg-yellow-200 text-yellow-800"
              >-</span
            >
          </div>
        </div>

        <div
          class="grid grid-cols-[180px_1fr] border border-gray-300 rounded-lg bg-white overflow-hidden"
        >
          <div
            class="px-4 py-3 font-bold text-gray-800 bg-white border-r border-gray-300"
          >
            Status
          </div>
          <div id="taskStatus" class="px-4 py-3 bg-white">
            <span
              class="inline-flex items-center px-3 py-1 rounded-sm text-sm font-semibold bg-blue-100 text-blue-700"
              >-</span
            >
          </div>
        </div>

        <div
          class="grid grid-cols-[180px_1fr] border border-gray-300 rounded-lg bg-white overflow-hidden"
        >
          <div
            class="px-4 py-3 font-bold text-gray-800 bg-white border-r border-gray-300"
          >
            Created At
          </div>
          <div id="taskCreatedAt" class="px-4 py-3 text-gray-700 bg-white">
            -
          </div>
        </div>
      </div>

      <button
        id="completeButton"
        type="button"
        class="mt-6 w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md transition-colors"
      >
        Mark as Completed
      </button>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const queryTaskIndex = Number.parseInt(params.get("id"), 10);
      const savedTaskIndex = Number.parseInt(
        localStorage.getItem("selectedTaskIndex"),
        10,
      );
      const tasks = JSON.parse(localStorage.getItem("tasks")) || [];
      const savedTask = JSON.parse(
        localStorage.getItem("selectedTask") || "null",
      );

      const taskIndex = Number.isInteger(queryTaskIndex)
        ? queryTaskIndex
        : savedTaskIndex;
      
      // Ambil data dari array tasks utama, jika gagal pakai fallback savedTask
      const task = (Number.isInteger(taskIndex) && tasks[taskIndex]) 
        ? tasks[taskIndex] 
        : savedTask;

      const titleEl = document.getElementById("taskTitle");
      const descriptionEl = document.getElementById("taskDescription");
      const dateEl = document.getElementById("taskDate");
      const priorityEl = document.getElementById("taskPriority");
      const statusEl = document.getElementById("taskStatus");
      const createdAtEl = document.getElementById("taskCreatedAt");
      const completeButton = document.getElementById("completeButton");
      const deleteButton = document.getElementById("deleteButton");

      function setPriorityBadge(value) {
        const normalized = (value || "medium").toLowerCase();
        let classes =
          "inline-flex items-center px-3 py-1 rounded-sm text-sm font-semibold ";

        if (normalized === "low") {
          classes += "bg-green-100 text-green-700";
        } else if (normalized === "high") {
          classes += "bg-red-100 text-red-700";
        } else {
          classes += "bg-yellow-200 text-yellow-800";
        }

        const label = value
          ? value.charAt(0).toUpperCase() + value.slice(1)
          : "Medium";
        priorityEl.innerHTML = `<span class="${classes}">${label}</span>`;
      }

      function setStatusBadge(completed) {
        if (completed) {
          statusEl.innerHTML =
            '<span class="inline-flex items-center px-3 py-1 rounded-sm text-sm font-semibold bg-green-100 text-green-700">Completed</span>';
          completeButton.textContent = "Completed";
          completeButton.disabled = true;
          completeButton.classList.add("opacity-80", "cursor-not-allowed");
          completeButton.classList.remove("hover:bg-blue-600");
        } else {
          statusEl.innerHTML =
            '<span class="inline-flex items-center px-3 py-1 rounded-sm text-sm font-semibold bg-blue-100 text-blue-700">In Progress</span>';
          completeButton.textContent = "Mark as Completed";
          completeButton.disabled = false;
          completeButton.classList.remove("opacity-80", "cursor-not-allowed");
          completeButton.classList.add("hover:bg-blue-600");
        }
      }

      if (!task) {
        titleEl.textContent = "Task not found";
        descriptionEl.textContent = "This task could not be loaded.";
        dateEl.textContent = "-";
        createdAtEl.textContent = "-";
        setPriorityBadge("medium");
        setStatusBadge(false);
        completeButton.disabled = true;
      } else {
        // Fallback lengkap untuk menangani berbagai alternatif nama property
        titleEl.textContent = task.name || task.title || task.taskName || "Untitled Task";
        descriptionEl.textContent =
          task.description || task.desc || "No description provided.";
        dateEl.textContent = task.date || task.dueDate || task.deadline || "-";
        createdAtEl.textContent = task.createdAt || task.date || task.dueDate || "-";
        setPriorityBadge(task.priority || "medium");
        setStatusBadge(Boolean(task.completed));
      }

      // Handler Tombol Completed yang langsung mengupdate Array LocalStorage utama
      completeButton.addEventListener("click", () => {
        if (Number.isInteger(taskIndex) && tasks[taskIndex]) {
          tasks[taskIndex].completed = true;
          localStorage.setItem("tasks", JSON.stringify(tasks));
        }
        if (task) {
          task.completed = true;
          localStorage.setItem("selectedTask", JSON.stringify(task));
        }
        setStatusBadge(true);
      });

      // Handler Tombol Delete di Halaman Detail
      deleteButton.addEventListener("click", () => {
        if (Number.isInteger(taskIndex) && tasks[taskIndex]) {
          tasks.splice(taskIndex, 1);
          localStorage.setItem("tasks", JSON.stringify(tasks));
          localStorage.removeItem("selectedTask");
          localStorage.removeItem("selectedTaskIndex");
          window.location.href = "home.html";
        }
      });
    </script>
  </body>
</html>
